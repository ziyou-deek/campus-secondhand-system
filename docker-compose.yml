services:
  mysql:
    image: mysql:8.0
    container_name: campus-secondhand-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
      MYSQL_DATABASE: campus_secondhand
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - campus_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

volumes:
  campus_mysql_data:
